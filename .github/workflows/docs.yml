name: Deploy Docs & Demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build library
        run: npm run build

      - name: Build docs (VitePress)
        run: npm run docs:build

      - name: Build demo page
        # Rewrites dev-server imports (/src/...) → built library files,
        # then places the result alongside the library files in docs output.
        run: |
          mkdir -p docs/.vitepress/dist/demo
          cp dist/timepicker.esm.js docs/.vitepress/dist/demo/timepicker.esm.js
          cp dist/timepicker.css   docs/.vitepress/dist/demo/timepicker.css
          sed \
            -e 's|href="/src/styles/timepicker.css"|href="./timepicker.css"|g' \
            -e "s|import { Timepicker } from '/src/index.ts'|import { Timepicker } from './timepicker.esm.js'|g" \
            examples/index.html > docs/.vitepress/dist/demo/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
