name: Deploy Docs & Demo

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a new push cancels any in-progress run
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npx vitest run

      - name: Build library
        run: npm run build

      - name: Build demo (examples/index.html)
        run: npm run build:examples

      - name: Build docs (VitePress)
        run: npm run docs:build

      - name: Merge demo into docs output
        run: |
          mkdir -p docs/.vitepress/dist/demo
          cp dist-examples/examples/index.html docs/.vitepress/dist/demo/index.html
          if [ -d dist-examples/assets ]; then
            cp -r dist-examples/assets docs/.vitepress/dist/demo/assets
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
